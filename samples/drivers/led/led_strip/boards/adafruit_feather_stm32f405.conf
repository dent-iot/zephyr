# we have one led, so we are just rgb-blinking: let's slow down a bit
CONFIG_SAMPLE_LED_UPDATE_DELAY=333

CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_PULSE_IO=y


CONFIG_PULSE_IO=y
CONFIG_PULSE_IO_STM32_TIMER_DMA=y
CONFIG_DMA=y
CONFIG_LOG=y
CONFIG_LED_STRIP_LOG_LEVEL_DBG=y
